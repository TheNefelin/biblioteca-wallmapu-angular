<app-section-header-component
  [title]="actionText()" 
  [actionText]="'Volver a Libros'"
  (actionClicked)="navigateGoBack()"
/>

<app-book-form-component
  [actionText]="actionText()"
  [isLoading]="isLoading()"
  [book]="book.data()"
  (deleteAuthor)="deleteAuthor($event)"
  (deleteSubject)="deleteSubject($event)"
  (submitForm)="submitBookForm($event)"
  (navigateToGenre)="navigateToGenre()"
  (navigateToAuthor)="navigateToAuthor()"
  (navigateToSubject)="navigateToSubject()"
/>

@if (isEditMode()) {
  <app-edition-list-components 
    [isLoading]="isLoading()"
    [editionDetailList]="edition.dataList()"
    (create)="onCreateEdition()"
    (edit)="editEdition($event)"
    (delete)="deleteEdition($event)"
  />
}
