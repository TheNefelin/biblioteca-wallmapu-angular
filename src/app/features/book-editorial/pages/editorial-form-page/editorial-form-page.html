<app-section-header-component
  [title]="'Editorial'"
  [actionText]="'Volver Atrás'"
  (actionClicked)="navigateBack()"
/>

<app-editorial-list-component
  [isLoading]="editorial.isLoading()"
  [editorialList]="editorial.dataList()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()"
  (searchFilter)="onSearchFilter($event)"
  (reload)="reload()"
  (create)="onCreateEditorial()"
  (edit)="onEditEditorial($event)"
  (delete)="onDeleteEditorial($event)"
/>

@if (editorial.showModal()) {
  <app-editorial-form-component
    [isLoading]="editorial.isSaving()"
    [editorial]="editorial.selectedItem()"
    (submitForm)="onSubmitEditorialForm($event)"
    (cancelForm)="onClearEditorialForm()"
  />
}
