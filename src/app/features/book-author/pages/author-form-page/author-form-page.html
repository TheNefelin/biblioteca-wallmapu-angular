<app-section-header-component
  [title]="'Autores'"
  [actionText]="'Volver Atrás'"
  (actionClicked)="navigateBack()"
/>

<app-author-list-component
  [isLoading]="author.isLoading()"
  [authorList]="author.dataList()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()"
  (searchFilter)="onSearchFilter($event)"
  (reload)="reload()"
  (create)="onCreateAuthor()"
  (edit)="onEditAuthor($event)"
  (delete)="onDeleteAuthor($event)"
/>

@if (author.showModal()) {
  <app-author-form-component
    [isLoading]="author.isSaving()"
    [author]="author.selectedItem()"
    (submitForm)="onSubmitAuthorForm($event)"
    (cancelForm)="onClearAuthorForm()"
  />
}
