<app-section-header-component
  [title]="'Géneros'"
  [actionText]="'Volver Atrás'"
  (actionClicked)="navigateBack()"
/>

<app-genre-list-component 
  [isLoading]="genre.isLoading()"
  [genreList]="genre.dataList()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()"
  (searchFilter)="onSearchFilter($event)"
  (reload)="reload()"
  (create)="onCreateGenre()"
  (edit)="onEditGenre($event)"
  (delete)="onDeleteGenre($event)"   
/>

@if (genre.showModal()) {
  <app-genre-form-component
    [isLoading]="genre.isSaving()"
    [genre]="genre.selectedItem()"
    (submitForm)="onSubmitGenreForm($event)"
    (cancelForm)="onClearGenreForm()"
  />
}
