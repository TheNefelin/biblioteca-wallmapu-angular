@if (toasts().length) {
  <div class="toast toast-end">
    @for (toast of toasts(); track toast.id) {
      <div class="alert bg-info text-my-light font-bold cursor-pointer"
           role="button"
           tabindex="0"
           (click)="close(toast.id)"
           (keydown.enter)="close(toast.id)"
           (keydown.space)="close(toast.id)">
        <span>{{ toast.message }}</span>
      </div>
    }
  </div>
}
