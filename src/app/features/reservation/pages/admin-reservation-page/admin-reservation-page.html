<app-section-header-component [title]="'Reservas'" />

<section class="p-4 grid grid-cols-1 gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-reservation-to-loan-component
      [clearTrigger]="clearCounter()"
      [isLoading]="detail.isLoading() || reservation.isSaving()"
      [reservationDetail]="detail.data()"
      (getReservationById)="onSearchReservation($event)"
      (reservationToLoan)="onRegisterReservationToLoan($event)"
      (clear)="onClear()"
    />

    <app-loan-policy-component/>
  </div>

  <div class="flex justify-end">
    <app-button-component
      [icon]="'expire'"
      [textBtn]="'Actualizar Estado de Reservas'"
      (clicked)="onUpdateExpireReservation()"
    />
  </div>

  <app-reservation-list-component
    [isLoading]="reservation.isLoading() || reservation.isSaving()"
    [reservationList]="reservation.dataList()"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [selectStatusId]="selectFilterStatusId()"
    (selectedIdStatus)="onFilterByIdStatus($event)"
    (cancelReservation)="onCancelReservation($event)"
    (reload)="reload()"
    (nextPage)="nextPage()"
    (prevPage)="prevPage()"
  />
</section>
