<ul class="list bg-base-100 rounded-box shadow-md m-4 overflow-hidden">
  <header class="p-6 pb-2 flex justify-between">
    <div>
      <h2 class="font-bold text-my-purple text-lg">
        Gestión de Noticias
      </h2>
      <p class="text-sm text-my-dark/50">
        Lista completa de noticias
      </p>
    </div>

    <div class="flex gap-2">
      <app-button-component [icon]="'refresh'" [textBtn]="'Refrescar'" (clicked)="reload.emit()" />
      <app-button-component [icon]="'create'" [textBtn]="'Crear Noticia'" (clicked)="create.emit()" />
    </div>
  </header>

  @if (isLoading()) {
    <section class="mx-auto p-4">
      <app-loading-component/>
    </section>
  } @else {
    @for (item of newsList(); track item.id_news) {
      <li class="list-row">
        <div class="relative overflow-hidden size-10">
          <img
            placeholder="/images/layout.webp"
            [ngSrc]="item.images[0]?.url || 'images/layout.webp'"
            [alt]="item.images[0]?.alt || 'Imagen por defecto'"
            fill
            class="object-cover rounded-box"
          />
        </div>
    
        <div>
          <div class="text-sm">
            <span>{{ item.created_at | date:'yyyy-MM-dd' }}</span>
            <span class="hidden md:inline"> - {{ item.created_at | date:'HH:mm:ss' }}</span>
          </div>
          <div class="text-xs uppercase font-semibold opacity-60">{{ item?.title }}</div>
        </div>
      
        <div class="flex gap-2">
          <app-button-component [icon]="'edit'" (clicked)="edit.emit(item)" />
          <app-button-component [icon]="'delete'" (clicked)="delete.emit(item)" />
        </div>
      </li>
    }
  }

  <app-pagination-component
    [totalPages]="totalPages()"
    [currentPage]="currentPage()"
    (prevPage)="prevPage.emit()"
    (nextPage)="nextPage.emit()" 
  />    
</ul>
