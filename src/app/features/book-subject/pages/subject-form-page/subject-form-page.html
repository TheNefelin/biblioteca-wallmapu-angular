<app-section-header-component
  [title]="'Descriptores'"
  [actionText]="'Volver Atrás'"
  (actionClicked)="navigateBack()"
/>

<app-subject-list-component
  [isLoading]="subject.isLoading()"
  [subjectList]="subject.dataList()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()"
  (searchFilter)="onSearchFilter($event)"
  (reload)="reload()"
  (create)="onCreateSubject()"
  (edit)="onEditSubject($event)"
  (delete)="onDeleteSubject($event)"
/>

@if (subject.showModal()) {
  <app-subject-form-component
    [isLoading]="subject.isSaving()"
    [subject]="subject.selectedItem()"
    (submitForm)="onSubmitSubjectForm($event)"
    (cancelForm)="onClearSubjectForm()"
  />
}
