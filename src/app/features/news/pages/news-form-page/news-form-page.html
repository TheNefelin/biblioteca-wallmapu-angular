<app-section-header-component
  [title]="actionText()" 
  [actionText]="'Volver a Noticias'"
  (actionClicked)="routeGoBack()"
/>

<section class="flex max-w-4xl flex-col gap-4 mx-auto p-4">
  <app-news-form-component 
    [isLoading]="news.isLoading() || news.isSaving() || newsGallery.isSaving()"
    [actionText]="actionText()"
    [news]="news.data()"
    (formSubmit)="onSubmitNewsForm($event)"
    (addImage)="onAddImages($event)" />
</section>

<section class="flex max-w-4xl mx-auto p-4">
  <app-image-list-component 
    [isLoading]="news.isLoading() || news.isSaving() || newsGallery.isSaving()"
    [previewList]="newsGallery.previewList()"
    (updateAlt)="onUpdateAlt($event)"
    (deleteImage)="onDeleteImage($event)" />
</section>
