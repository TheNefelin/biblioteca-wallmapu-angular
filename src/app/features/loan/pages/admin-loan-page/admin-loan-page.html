<app-section-header-component [title]="'Prestamos'" />

<section class="p-4 grid grid-cols-1 gap-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-loan-to-return-component
      [clearTrigger]="clearCounter()"
      [isLoading]="detail.isLoading()"
      [loanDetailModel]="detail.data()"
      (getLoanByBarcode)="onSearchLoanByBarcode($event)"
      (returnLoan)="onReturnLoan($event)"
      (clear)="onClear()"
    />
  
    <app-loan-policy-component/>
  </div>

  <div class="flex justify-end">
    <app-button-component
      [icon]="'expire'"
      [textBtn]="'Actualizar Estado de Préstamos'"
      (clicked)="onUpdateExpireLoan()"
    />
  </div>  
  
  <app-loan-list-component 
    [isLoading]="loan.isLoading() || loan.isSaving()"
    [loanList]="loan.dataList()"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [selectStatusId]="selectFilterStatusId()"
    (selectedIdStatus)="onFilterByIdStatus($event)"
    (reload)="reload()"
    (nextPage)="nextPage()"
    (prevPage)="prevPage()"    
  />
</section>
