<app-section-header-component
  [title]="'Formato'"
  [actionText]="'Volver Atrás'"
  (actionClicked)="navigateBack()"
/>

<app-format-list-component
  [isLoading]="format.isLoading()"
  [formatList]="format.dataList()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()"
  (searchFilter)="onSearchFilter($event)"
  (reload)="reload()"
  (create)="onCreateFormat()"
  (edit)="onEditFormat($event)"
  (delete)="onDeleteFormat($event)"
/>

@if (format.showModal()) {
  <app-format-form-component
    [isLoading]="format.isSaving()"
    [format]="format.selectedItem()"
    (submitForm)="onSubmitFormatForm($event)"
    (cancelForm)="onClearFormatForm()"
  />
}
