<app-section-header-component
  [title]="headerText()" 
  [actionText]="'Volver a Libros'"
  (actionClicked)="navigateGoBack()"
/>

<app-book-form-component
  [actionText]="headerText()"
  [isLoading]="isLoading()"
  [bookFormVM]="bookFormVM()"
  (onDeleteAuthor)="deleteAuthor($event)"
  (onDeleteSubject)="deleteSubject($event)"
  (onFormSubmit)="formSubmit($event)"
  (onNavigateToGenre)="navigateToGenre()"
  (onNavigateToAuthor)="navigateToAuthor()"
  (onNavigateToSubject)="navigateToSubject()"
/>

@if (isEditMode()) {
  <div class="m-4 flex justify-end">
    <app-button-create-component
      [textBtn]="'Crear Edición'"
      (clicked)="onCreateEdition()"
    />
  </div>  
}

<app-edition-list-components 
  [isLoading]="isLoading()"
  [editionDetailList]="computedEditionList()"
  (edit)="editEdition($event)"
  (delete)="onDeleteEdition($event)"
/>
