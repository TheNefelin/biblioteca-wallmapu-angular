<app-section-header-component
  [title]="heading()" 
  [actionText]="'Volver a Lista de Libros'"
  (actionClicked)="onNavigateGoBack()"
/>

<app-book-form-component
  [heading]="heading()"
  [isLoading]="isLoading() || book.isSaving()"
  [book]="book.data()"
  (submitForm)="onSubmitBookForm($event)"
  (navigateToGenre)="onNavigateToGenre()"
  (navigateToAuthor)="onNavigateToAuthor()"
  (navigateToSubject)="onNavigateToSubject()"
/>

@if (isEditMode()) {
  <app-edition-list-components 
    [isLoading]="isLoading() || edition.isSaving()"
    [editionDetailList]="edition.dataList()"
    (create)="onCreateEdition()"
    (edit)="onEditEdition($event)"
    (delete)="onDeleteEdition($event)"
  />
}
