<app-section-header-component
  [title]="'Notificaciones'"
/>

<section class="p-4 grid grid-cols-1 gap-4 max-w-7xl mx-auto">
  <app-notification-list-component
    [isLoading]="notification.isLoading() || notification.isSaving()"
    [notificationList]="notification.dataList()"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [showOnlyUnread]="showOnlyUnread()"
    (reload)="reload()"
    (filterNotRead)="onFilterNotRead($event)"
    (nextPage)="nextPage()"
    (prevPage)="prevPage()"
    (sendNotification)="onCreateNotification()"
  />
</section>

@if (notification.showModal()) {
  <app-notification-form-component
    [isLoading]="notification.isSaving()"
    (submitForm)="onSubmitNotificationForm($event)"
    (cancelForm)="onClearNotificationForm()"
  />
}
