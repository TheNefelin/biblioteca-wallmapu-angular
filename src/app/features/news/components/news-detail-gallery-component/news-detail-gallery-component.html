@if (!news()) {

} @else {
  <section class="mb-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      
      @for (image of news()?.images; track image.id_news_gallery) {
        <div 
          class="relative group cursor-pointer overflow-hidden rounded-xl shadow-lg"
          role="button"
          tabindex="0"
          aria-label="Ampliar imagen {{ image.alt }}"
          (click)="isImageModalOpen.set(true); selectedImage.set(image.url)"
          (keydown.enter)="isImageModalOpen.set(true); selectedImage.set(image.url)">
          
          <figure class="relative aspect-4/3">
            <img 
              [ngSrc]="image.url" 
              [alt]="image.alt"
              fill
              priority
              class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
            />
          </figure>
          <div class="absolute inset-0 bg-linear-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <div class="absolute bottom-4 left-4 text-white">
              <p class="font-semibold">{{ image.alt }}</p>
            </div>
          </div>
        </div>
      }
  
    </div>
  </section>
}

<app-modal-image-component
  [isOpen]="isImageModalOpen()"
  [imageUrl]="selectedImage()"
  (closeModal)="isImageModalOpen.set(false)"
/>
