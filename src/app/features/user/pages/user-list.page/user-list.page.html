<section class="flex flex-col justify-between h-full">

  <div>
    <app-section-header-component 
      title="Usuarios"
      searchPlaceholder="Buscar Usuario"
      (searchChange)="onSearchChange($event)"
    />

    <section class="p-4">
      <app-user-list-component 
        [editRole]="editRole()"
        [isLoading]="isLoading()"
        [userList]="userDetailListComputed()"
        [totalPages]="totalPages()"
        [currentPage]="currentPage()"
        (prevPage)="prevPage()"
        (nextPage)="nextPage()" 
        (editUser)="onNavigateToEdit($event)"
      />
    </section>
  </div>

</section>
